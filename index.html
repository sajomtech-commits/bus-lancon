<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lançon Bus — 12 · 17 · 530</title>
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Helvetica,Arial,sans-serif;background:#fff;color:#111}
header{max-width:560px;margin:0 auto;padding:24px 16px 12px;text-align:center}
header h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
header p{font-size:13px;color:#888;margin-top:4px}
.container{max-width:560px;margin:0 auto;padding:0 12px 24px}
.card{border:1px solid #e8e8e8;border-radius:16px;padding:16px;margin-top:12px}
.card h2{font-size:14px;font-weight:700;margin-bottom:12px}
label{font-size:11px;font-weight:700;color:#888;letter-spacing:.04em;text-transform:uppercase}
.row{display:flex;gap:8px;margin-top:6px}
select,input{flex:1;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff;font:inherit;font-size:15px}
button{padding:12px 16px;border-radius:12px;border:1px solid #111;background:#111;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
button.ghost{background:#fff;color:#111}
.result{margin-top:12px;padding:14px;border-radius:12px;background:#111;color:#fff;display:none}
.result.show{display:block}
.result .big{font-size:18px;font-weight:800}
.big-buttons{display:grid;gap:8px;margin-top:12px}
.line-btn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px;border:1px solid #e8e8e8;border-radius:16px;background:#fff;cursor:pointer}
.line-btn.active{background:#111;color:#fff;border-color:#111}
.line-btn strong{font-size:20px}
.line-btn span{font-size:12px;color:#888}
.line-btn.active span{color:#aaa}
.tabs{display:flex;gap:6px;margin:12px 0 8px}
.tab{flex:1;padding:8px;border-radius:999px;border:1px solid #ddd;background:#fff;font-size:13px;font-weight:600;cursor:pointer;text-align:center}
.tab.active{background:#111;color:#fff;border-color:#111}
.times{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:thin}
.time{flex-shrink:0;padding:8px 12px;border-radius:999px;border:1px solid #e8e8e8;background:#fff;font-size:14px;font-variant-numeric:tabular-nums}
.time.next{background:#111;color:#fff;border-color:#111}
.stop{margin-top:14px}
.stop-name{font-size:13px;font-weight:700;margin-bottom:6px}
.muted{font-size:12px;color:#888;text-align:center;margin-top:16px}
</style>
</head>
<body>
<header>
  <h1>Lançon Bus</h1>
  <p>12 · 17 · 530 — app épurée</p>
</header>

<div class="container">

  <!-- APP -->
  <div class="card">
    <h2>Quel bus prendre ?</h2>
    <label>Tu es où ?</label>
    <div class="row">
      <select id="stopSelect"></select>
      <button class="ghost" id="geoBtn">📍</button>
    </div>
    <label style="margin-top:10px;display:block">Heure</label>
    <div class="row">
      <input type="time" id="timeInput">
      <button class="ghost" id="nowBtn">Maintenant</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button style="flex:1" id="goBtn">Voir le prochain bus</button>
    </div>
    <div id="result" class="result"></div>
  </div>

  <!-- LIGNES -->
  <div class="big-buttons">
    <button class="line-btn" data-line="12"><span><strong>12</strong><br><span>Salon ↔ Lançon</span></span><span>›</span></button>
    <div class="card" id="detail-12" style="display:none"></div>

    <button class="line-btn" data-line="17"><span><strong>17</strong><br><span>Salon ↔ Aéroport</span></span><span>›</span></button>
    <div class="card" id="detail-17" style="display:none"></div>

    <button class="line-btn" data-line="530"><span><strong>530</strong><br><span>Scolaire</span></span><span>›</span></button>
    <div class="card" id="detail-530" style="display:none"></div>
  </div>

  <p class="muted">Fonctionne hors-ligne · Ajouter à l’écran d’accueil</p>
</div>

<script>
const DATA={
"12":{
  "aller":{"direction":"Salon → Lançon","stops":[
    {"nom":"Salon · PEM Quai 5","times":["06:00","07:00","07:30","08:00",null,null,"09:30","10:30","11:30",null,"12:30","13:00","13:30","14:00","14:30","15:30","16:30","17:00","17:30","18:05","18:30","19:15"]},
    {"nom":"Salon · Foch","times":["06:02","07:02","07:33","08:03","08:33","09:02","09:32","10:32","11:32","12:03","12:32","13:02","13:32","14:02","14:32","15:32","16:33","17:03","17:33","18:08","18:32","19:17"]},
    {"nom":"Lançon · Mourguettes","times":["06:11","07:11","07:43","08:13","08:43","09:11","09:41","10:41","11:41","12:14","12:41","13:11","13:41","14:11","14:41","15:41","16:44","17:14","17:44","18:19","18:41","19:26"]},
    {"nom":"Lançon · Marcel Pagnol","times":["06:17","07:17","07:49","08:19","08:49","09:17","09:47","10:47","11:47","12:20","12:47","13:17","13:47","14:17","14:47","15:47","16:50","17:20","17:50","18:25","18:47","19:32"]}
  ]},
  "retour":{"direction":"Lançon → Salon","stops":[
    {"nom":"Lançon · Marcel Pagnol","times":["06:44","06:34","07:30","08:00","08:33","09:03","10:03","11:03","11:33","12:00","12:33","13:03","13:33","14:03","15:03","16:00","16:30","17:00","17:30","18:00","18:34","19:34"]},
    {"nom":"Lançon · Mourguettes","times":["06:47","06:37","07:33","08:03","08:36","09:06","10:06","11:06","11:36","12:03","12:36","13:06","13:36","14:06","15:06","16:03","16:33","17:03","17:33","18:03","18:37","19:37"]},
    {"nom":"Salon · PEM Quai 5","times":["07:00","06:50","07:50","08:20","08:53","09:20","10:20","11:20","11:50","12:20","12:50","13:20","13:50","14:20","15:20","16:20","16:50","17:20","17:50","18:20","18:50","19:50"]}
  ]}
},
"17":{
  "aller":{"direction":"Salon → Aéroport","stops":[
    {"nom":"Salon · PEM Quai 8","times":["05:30","06:30","08:30","09:30","11:30","12:30","14:30","15:30","17:30","18:30"]},
    {"nom":"Lançon · Mourguettes","times":["05:41","06:46","08:41","09:41","11:46","12:46","14:41","15:41","17:46","18:46"]},
    {"nom":"Aéroport","times":["06:30","07:46","09:30","10:30","12:46","13:46","15:30","16:30","18:46","19:46"]}
  ]}
},
"530":{
  "aller":{"direction":"Scolaire","stops":[
    {"nom":"Salon · Trophées","times":["16:10","17:25","18:15"]},
    {"nom":"Lançon · Sibourg","times":["16:45","17:59","18:49"]}
  ]}
}
};

const stopsList=[...new Set(Object.values(DATA).flatMap(v=>Object.values(v).filter(Boolean).flatMap(d=>d.stops.map(s=>s.nom))))];
const stopSelect=document.getElementById('stopSelect');
stopsList.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;stopSelect.appendChild(o)});
stopSelect.value="Salon · PEM Quai 5";
const timeInput=document.getElementById('timeInput');
function setNow(){timeInput.value=new Date().toTimeString().slice(0,5)};setNow();
document.getElementById('nowBtn').onclick=setNow;
function toMin(t){const [h,m]=t.split(':').map(Number);return h*60+m}
document.getElementById('goBtn').onclick=()=>{
  const stop=stopSelect.value, t=timeInput.value||"16:30";
  const min=toMin(t);
  let best=null;
  Object.entries(DATA).forEach(([line,dirs])=>{
    Object.entries(dirs).forEach(([dirKey,dir])=>{
      if(!dir) return;
      const s=dir.stops.find(x=>x.nom===stop) || dir.stops[0];
      const times=s.times.filter(Boolean);
      const nxt=times.find(x=>toMin(x)>=min) || times[0];
      const wait = times.find(x=>toMin(x)>=min) ? toMin(nxt)-min : null;
      if(wait!==null && (best===null || wait<best.wait)) best={line,dir:dir.direction,stop:s.nom,time:nxt,wait};
    });
  });
  const el=document.getElementById('result');
  if(best){
    el.innerHTML=`<div class="big">Ligne ${best.line} à ${best.time}</div><div style="opacity:.8;margin-top:4px">${best.dir} · départ ${best.stop} · dans ${best.wait} min</div>`;
  } else {
    el.innerHTML=`<div class="big">Aucun bus</div>`;
  }
  el.classList.add('show');
};
document.getElementById('geoBtn').onclick=()=>{
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p=>{
    const lat=p.coords.latitude;
    // Salon lat 43.64 -> Salon, sinon Lançon
    stopSelect.value = lat>43.61 ? "Salon · PEM Quai 5" : "Lançon · Mourguettes";
    document.getElementById('goBtn').click();
  });
};

// Détails lignes
document.querySelectorAll('.line-btn').forEach(btn=>{
  btn.onclick=()=>{
    const line=btn.dataset.line;
    const detail=document.getElementById('detail-'+line);
    const open=detail.style.display!=='none';
    document.querySelectorAll('[id^=detail-]').forEach(d=>d.style.display='none');
    document.querySelectorAll('.line-btn').forEach(b=>b.classList.remove('active'));
    if(open){detail.style.display='none';return}
    btn.classList.add('active');detail.style.display='block';
    render(line,detail);
  }
});
function render(line,el){
  const dirs=DATA[line];
  const hasRetour=!!dirs.retour;
  let html='';
  if(hasRetour){
    html+=`<div class="tabs"><button class="tab active" data-dir="aller">Aller</button><button class="tab" data-dir="retour">Retour</button></div>`;
  }
  html+=`<div id="times-${line}"></div>`;
  el.innerHTML=html;
  if(hasRetour){
    el.querySelectorAll('.tab').forEach(tab=>{
      tab.onclick=()=>{
        el.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');
        draw(line,tab.dataset.dir,el.querySelector(`#times-${line}`));
      }
    });
  }
  draw(line,'aller',el.querySelector(`#times-${line}`));
}
function draw(line,dir,container){
  const data=DATA[line][dir];
  const now=timeInput.value||"16:30";
  let html=`<div style="font-size:12px;color:#888;margin-bottom:8px">${data.direction}</div>`;
  data.stops.forEach(s=>{
    html+=`<div class="stop"><div class="stop-name">${s.nom}</div><div class="times">`;
    s.times.filter(Boolean).forEach(t=>{
      const cls = t===s.times.filter(Boolean).find(x=>toMin(x)>=toMin(now)) ? 'time next' : 'time';
      html+=`<span class="${cls}">${t}</span>`;
    });
    html+=`</div></div>`;
  });
  container.innerHTML=html;
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
